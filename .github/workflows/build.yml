name: Build JARVIS AI APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip if needed and locate project
        shell: bash
        run: |
          if [ -z "$(find . -name buildozer.spec -not -path './.git/*' | head -1)" ]; then
            for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done
          fi
          SPEC=$(find . -name buildozer.spec -not -path './.buildozer/*' -not -path './.git/*' | head -1)
          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"; ls -la; exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"
          echo "Found $SPEC"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 "cython<3" virtualenv setuptools

      - name: Syntax check
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m compileall -q main.py jarvis

      - name: Cache Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ${{ env.PROJECT_DIR }}/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show end of log on failure
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: tail -n 80 build.log || true

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -l bin/*.apk
          test -n "$(ls bin/*.apk 2>/dev/null)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
